services:
  - type: worker
    name: laundry-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DGIS_KEY
        sync: false
      # JSON сервисного аккаунта Firebase одной строкой — вставляется в панели Render, не в git
      - key: FIREBASE_CREDENTIALS
        sync: false
